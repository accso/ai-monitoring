# Per-model price overrides in USD per 1M tokens; they win over models.dev.
# Use for promotions, missing models or models.dev mismatches (see docs/pricing.md).
# `credits` sets explicit credits per 1M tokens (github-copilot otherwise uses USD x 100).
#
# overrides:
#   - provider: github-copilot
#     model: some-new-model
#     input: 1
#     output: 5
#     cache_read: 0.1
#     cache_write: 1.25
#     credits: { input: 100 }
#     from: 2026-09-01   # optional: price valid from this date (UTC); several entries per model form a price history
#
# Dated entries are backfilled into VictoriaMetrics (last PRICING_BACKFILL_DAYS, default 90) once per start/change.
# To correct already stored history, delete the series first: curl 'http://127.0.0.1:8428/api/v1/admin/tsdb/delete_series?match[]=model_price_usd_per_mtok{gen_ai_provider_name="anthropic"}'
#
# anthropic: pinned to https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-10-21).
# cache_write = 5-minute cache write (1.25x input); 1h writes (2x) are not modelled.
# claude-haiku-5-5 uses the "prompts up to 100,000 tokens" tier (over: 0.5 / 0.625 / 0.05 / 2.5).
# Dated and alias ids are listed so Claude Code / API ids resolve as well.
overrides:
  - { provider: anthropic, model: claude-fable-5-1, input: 10, output: 50, cache_read: 0.25, cache_write: 12.5 }
