name: ai-monitoring

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      victoriametrics:
        condition: service_healthy
    restart: unless-stopped

  pricing-sync:
    image: oven/bun:1.4.2-alpine
    working_dir: /app
    command: ["bun", "run", "src/cli.ts", "--loop"]
    environment:
      VM_URL: http://victoriametrics:8428
      PRICING_PROVIDERS: ${PRICING_PROVIDERS:-github-copilot,anthropic,openai}
    volumes:
      - ./pricing/src:/app/src:ro
      - ./pricing/overrides.yaml:/app/overrides.yaml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=1y
      - -httpListenAddr=:8428
      - -search.latencyOffset=1s
      - -opentelemetry.usePrometheusNaming
      - -opentelemetry.promoteScopeMetadata=false
    volumes:
      - vm_data:/storage
    ports:
      - "127.0.0.1:8428:8428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  vm_data:
  grafana_data:
